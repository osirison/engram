packages:
  - 'apps/*'
  - '!apps/marketing-site'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - recharts@3.9.1

overrides:
  # DoS via three separate vectors: crafted multipart field names, a file
  # descriptor leak on aborted uploads, and oversized array indices in field
  # names. GHSA-wc9g-mqfw-jrwm / GHSA-qfvm-cv95-jqjf / GHSA-535w-7cp7-47q4,
  # fixed in 2.3.0. Pulled by @nestjs/platform-express; only 2.x is live.
  multer: '>=2.3.0 <3'
  form-data: '>=4.0.6 <5'
  # Pin to the patched 6.x line: the unbounded '>=6.27.0' pulled undici 8.x into
  # @qdrant/js-client-rest (which needs ^6.24.0), breaking its REST transport
  # ("invalid onRequestStart method"). 6.27.0 is the patched 6.x release.
  undici: '>=6.27.0 <7'
  # Patched 4.12.34 for four advisories in the 4.x line: memo() retaining SSR
  # output across requests (cross-user data disclosure), the Proxy Helper not
  # stripping response headers named in the Connection header, and algorithmic
  # DoS in both the Language middleware and CORS (ReDoS via
  # Access-Control-Request-Headers). Pulled transitively by
  # @hono/node-server, @modelcontextprotocol/sdk and @prisma/dev; nothing
  # depends on it directly. Only 4.x is live, so the bound is the real major.
  hono: '>=4.12.34 <5'
  # Patched floor for GHSA-fx2h-pf6j-xcff (vite dev-server `server.fs.deny`
  # bypass on Windows). Pulled transitively by Astro/Starlight (apps/docs).
  # Previously capped at <8.1.0 to stay under a minimum-release-age gate that no
  # longer exists (see docs/ops/dependency-automation.md — the gate broke
  # --frozen-lockfile and was moved to Renovate). That cap had gone stale and was
  # holding the tree two minors back, so it is now bounded at the real major.
  vite: '>=8.0.16 <9'
  # Patched 3.1.x line for GHSA-4c8g-83qw-93j6 / CVE-2026-13676 / CVE-2026-16221
  # (host confusion + policy-bypass via improper Unicode hostname handling).
  # Raised again to 3.1.6 for four more host-confusion/SSRF advisories in the
  # same hostname-parsing code (GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp). Pulled transitively by ajv (^3).
  # Kept in 3.x for ajv compatibility.
  fast-uri: '>=3.1.6 <4'
  # Patched 2.9+ for CVE-2026-59892 (DoS via malformed HTTP header decoding in
  # the Jaeger propagator), pulled transitively by @opentelemetry/sdk-node. The
  # rest of the @opentelemetry/* 2.x STABLE family is aligned to the same line
  # so the graph resolves to a single @opentelemetry/core — overriding only
  # propagator-jaeger drags in a second core@2.10 alongside the 2.8 family and
  # silently breaks OTel context propagation. The 0.219.x experimental packages
  # (sdk-node, exporters, instrumentation) are a separate version line and are
  # intentionally left untouched.
  '@opentelemetry/propagator-jaeger': '>=2.9.0 <3'
  '@opentelemetry/core': '>=2.9.0 <3'
  '@opentelemetry/resources': '>=2.9.0 <3'
  '@opentelemetry/context-async-hooks': '>=2.9.0 <3'
  '@opentelemetry/sdk-metrics': '>=2.9.0 <3'
  '@opentelemetry/sdk-trace-base': '>=2.9.0 <3'
  '@opentelemetry/sdk-trace-node': '>=2.9.0 <3'
  '@opentelemetry/exporter-zipkin': '>=2.9.0 <3'
  # --- 2026-08-02 advisory sweep -------------------------------------------
  # Every entry below is an UPPER-BOUNDED floor. An unbounded '>=x' lets pnpm
  # jump the next major: '>=4.3.1' on js-yaml silently resolved to 5.2.3, and
  # forcing brace-expansion across majors handed minimatch 3.x an ESM-only 5.x
  # and broke `eslint` outright ("expand is not a function"). Bound every one.
  #
  # Path traversal in `serve-static` on Windows (GHSA). Fixed only in 2.x, which
  # @modelcontextprotocol/sdk did not accept until 1.30.0 ("^1.19.9 || ^2.0.5"),
  # so this override is only valid alongside that bump — not before it.
  '@hono/node-server': '>=2.0.5 <3'
  # Path traversal in previous-source-map auto-loading, arbitrary file read, and
  # a `</style>` XSS in the stringifier. Pulled by next and tailwind.
  postcss: '>=8.5.18 <9'
  # DoS via infinite loop in .proto option parsing. Held in 7.x — 8.x is a major
  # and @grpc/proto-loader (via @opentelemetry) still expects ^7.
  protobufjs: '>=7.6.5 <8'
  # `removeScripts` left some executable scripts intact; a follow-up bypass via
  # namespaced and control-character attribute names (GHSA-w27v-7q3p-w38r) was
  # fixed in 4.1.0. Pinned by Astro, which depends on an exact-ish range, so the
  # floor has to be forced here.
  svgo: '>=4.1.0 <5'
  # record() issue paths could make flatten() throw for inherited Object keys.
  valibot: '>=1.4.2 <2'
  # DoS when an invalid `limit` value is supplied. Pulled by express 5.
  body-parser: '>=2.3.0 <3'
  # Inherited libvips CVEs. Also a direct dependency of apps/docs (bumped there
  # too); this covers the copy Next.js pulls into apps/web.
  # Raised again to 0.35.4 for inherited libheif CVEs (GHSA-rgj7-g3m4-5g8c,
  # wrapping GHSA-g89c-p67h-r497 and GHSA-2jg2-4ch7-h545).
  # Bounded at <1, NOT <0.36 — sharp is the exception to the rule above. It does
  # not backport to old minor lines: 0.34.5 was left vulnerable with no 0.34.6,
  # and the fix required crossing 0.34 -> 0.35. A `<0.36` bound would therefore
  # pin us below the next fix instead of ahead of it.
  sharp: '>=0.35.4 <1'
  # Quadratic-complexity DoS via YAML merge-key chains. Both live majors are
  # affected and each has its own patch, so each line is raised in place rather
  # than collapsed: `@istanbuljs/load-nyc-config` needs js-yaml 3.x, whose
  # safeLoad/safeDump were removed in 4.
  # Raised again for GHSA-2883-xcg3-v3hh: the merge-key cap did not count empty
  # merge sources, leaving the same CPU-exhaustion path open. Fixed in 3.15.2
  # and 4.3.2.
  'js-yaml@^3': '>=3.15.2 <4'
  'js-yaml@^4': '>=4.3.2 <5'
  # DoS via exponential-time and unbounded brace expansion. Same shape: every
  # live major is affected and separately patched. Collapsing them is not an
  # option — minimatch 3.x/9.x `require()` this package, and 5.x is ESM-only, so
  # a cross-major floor breaks eslint with "expand is not a function".
  'brace-expansion@^1': '>=1.1.18 <2'
  'brace-expansion@^2': '>=2.1.4 <3'
  'brace-expansion@^5': '>=5.0.9 <6'
  # --- 2026-08-05 -----------------------------------------------------------
  # SSRF / trust-boundary bypass: Address4 decodes leading-zero octets as
  # decimal ('010.0.0.1' -> 10.0.0.1) while the resolver that later dials the
  # host reads them as octal, so an allowlist check and the connection it
  # guards can disagree about which address was meant.
  # GHSA-mwp4-54f8-5fhr / CVE-2026-69192, fixed in 10.3.1.
  # Pulled transitively via @modelcontextprotocol/sdk > express-rate-limit on
  # five workspace paths; nothing depends on it directly. Only 10.x is live, so
  # the bound is the real major.
  ip-address: '>=10.3.1 <11'
  # --- 2026-08-31 -----------------------------------------------------------
  # Stack-exhaustion DoS: deepmerge() recurses per key with no cycle detection,
  # so two inputs that self-reference through the same key path recurse until
  # Node throws RangeError. GHSA-ggr8-5vv4-36mx, fixed in 8.0.0 — cycle handling
  # is a v8 feature, so 7.1.6 (the last 7.x) is still affected and there is no
  # same-major escape. Pulled only by @prisma/config, which pins deepmerge-ts
  # exactly ('7.1.5') and still does at 7.10.0, so the major has to be crossed
  # here. Safe to cross: @prisma/config uses only the plain `deepmerge` export
  # on record configs, and every v8 breaking change is off that surface (Map
  # deep-merge default, deepmergeInto mutation semantics, type renames). Both
  # majors are ESM-only, so the module format does not change either.
  'deepmerge-ts': '>=8.0.0 <9'
  # Custom generators loop indefinitely when size is zero — a hang, not just a
  # bad id. GHSA-2v37-7h3g-55p8, fixed in 3.3.18.
  # Pulled only by postcss (^3), and 3.x is the only major in the tree.
  nanoid: '>=3.3.18 <4'
  # --- 2026-09-16 advisory sweep ---------------------------------------------
  # Two advisories: unbounded memory growth from a query-result cache with no
  # eviction (OOM under load), and a crash / prototype write when a project
  # supplies custom stats via browserslist-stats.json (normalizeStats trusts
  # the shape of untrusted JSON). GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g,
  # fixed in 4.28.7. Pulled transitively by webpack (via @nestjs/cli) and
  # Babel/Jest; nothing depends on it directly. Only 4.x is live.
  browserslist: '>=4.28.7 <5'
  # Auth-plugin downgrade: a malicious or compromised server can force the
  # client down to mysql_clear_password, sending credentials in plaintext.
  # GHSA-3f6p-5ww8-9rcr, fixed in 3.22.0. Pulled transitively by prisma (an
  # optional driver dependency); nothing in the workspace uses MySQL. Only 3.x
  # is live.
  mysql2: '>=3.22.0 <4'
  # DoS via malformed TOML documents. GHSA-7w5x-hrqm-74c2, fixed in 1.7.1.
  # Pulled transitively by @astrojs/internal-helpers (Astro/Starlight, via
  # apps/docs); nothing depends on it directly. Only 1.x is live.
  smol-toml: '>=1.7.1 <2'

# Allow openai to use zod v4 (openai declares a peer dep on zod ^3 but only uses
# it for its optional structured-output helpers, which we don't use).
peerDependencyRules:
  allowedVersions:
    openai>zod: '4'
